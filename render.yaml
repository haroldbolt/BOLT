services:
  - type: web
    name: bolt-pets-operacion
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerCommand: node --import tsx deployment/start-pilot.ts
    autoDeployTrigger: 'off'
    numInstances: 1
    healthCheckPath: /api/v1/health
    disk:
      name: bolt-operacion
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: BOLT_IMAGE_STAGE
        value: production
      - key: BOLT_PILOT_VOLUME
        value: /data
      - key: BOLT_REQUIRE_VOLUME_MOUNT
        value: '1'
      - key: BOLT_PILOT_STORE_ID
        value: HUB_SUBA
      - key: BOLT_ADMIN_SETUP_TOKEN
        sync: false
      - key: BOLT_TRUSTED_PROXY_CIDRS
        sync: false
