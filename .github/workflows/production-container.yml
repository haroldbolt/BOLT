name: Contenedor BOLT
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Comprobar archivos privados y credenciales antes de compilar
        env:
          BOLT_PR_BASE: ${{ github.event.pull_request.base.sha }}
          BOLT_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --test scripts/check-repository-secrets.test.mjs
          node scripts/check-repository-secrets.mjs --pr "$BOLT_PR_BASE" "$BOLT_PR_HEAD"
      - name: Construir la imagen y comprobar el arranque aislado
        run: bash deployment/check-container.sh
      - name: Preparar las dependencias e interfaces compiladas del contenedor para el navegador
        run: |
          docker build --target build -t bolt-rdi-browser .
          container=$(docker create bolt-rdi-browser)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/opt/bolt/node_modules" ./node_modules
          docker cp "$container:/opt/bolt/dist" ./dist
          mkdir -p "$RUNNER_TEMP/bolt-node"
          docker cp "$container:/usr/local/bin/node" "$RUNNER_TEMP/bolt-node/node"
          echo "$RUNNER_TEMP/bolt-node" >> "$GITHUB_PATH"
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/bolt-browser" playwright-core@1.65.1
      - name: Confirmación HTTP, reservas, reinicio y respaldo de Cargo en instalación aislada
        run: |
          npm run test:r1
          npm run test:r2
          npm run test:pilot
      - name: Verificar la identidad de Google y la persistencia de sesiones con proveedor aislado
        run: npm run test:r3
      - name: Checkout en móvil y escritorio con una instalación temporal por caso
        run: |
          export BOLT_BROWSER_MODULE="$RUNNER_TEMP/bolt-browser/node_modules/playwright-core"
          export BOLT_TEST_CHROME="$(command -v google-chrome)"
          export BOLT_TEST_SCREENSHOTS="$RUNNER_TEMP/bolt-capturas"
          node src/tests/adminBootstrapScreens.browser.mjs
          node --import tsx src/tests/threeStoreCashBrowser.mjs
          node deployment/tests/address-map/run.mjs
      - name: Capturas de checkout y Admin con datos ficticios
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bolt-checkout-tres-sedes
          path: ${{ runner.temp }}/bolt-capturas
          retention-days: 7
